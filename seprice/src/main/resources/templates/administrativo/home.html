<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SePrice - Administrativo</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <!-- <div th:insert="~{usuario/templateAdministrativo.html::header-inicial}" th:if="${sesion==null}"></div> -->
    <!-- <div th:insert="~{usuario/templateAdministrativo.html::header-user}" th:unless="${sesion==null}"></div> -->
    <div th:insert="~{administrativo/template_administrativo.html::navbar-administrativo}"></div>
    <br>


    <!-- Main -->
    <main>

        <div th:insert="~{administrativo/template_administrativo.html::header-administrativo}"></div>

        <div class="contenedor-exito">
            <div th:if="${exito}" class="alerta-exito" th:text="${exito}"></div>
        </div>

        <div class="width-100 margin-top20">
            <div class="dos-columnas-20-80">
                <div class="columna-sidebar">
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">AGENDA </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">PACIENTES </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">TURNOS </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">MÉDICOS </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">CONSULTORIOS </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">SALA DE ESPERA </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">ESPECIALIDAD </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                    <div class="dos-columnas-70-30 boton-sidebar">
                        <p class="texto-sidebar">LISTAR PACIENTES AT. POR MÉDICO </p>
                        <div class="contenedor-img-btn-sidebar">
                            <img class="img-btn-sidebar" th:src="@{/imagenes/agenda.png}" alt="agenda">
                        </div>
                    </div>
                </div>
 
 
                <div class="columna-principal">
                    <div class="dos-columnas">
                        <img class="img-principal padding10 margin-top20"
                            th:src="@{/imagenes/administracion-clinica.png}" alt="img-principal">

                        <div class="dos-columnas margin10">

                            <div class="tarjeta-naranja">
                                <h6 class="texto-tarjeta">TURNOS DEL DÍA</h6>
                                <h3 class="numero-tarjeta">462</h3>
                            </div>

                            <div class="tarjeta-verde">
                                <h6 class="texto-tarjeta">TURNOS ACREDITADOS</h6>
                                <h3 class="numero-tarjeta">226</h3>
                            </div>

                            <div class="tarjeta-naranja">
                                <h6 class="texto-tarjeta">EN CONSULTORIO</h6>
                                <h3 class="numero-tarjeta">23</h3>
                            </div>

                            <div class="tarjeta-verde">
                                <h6 class="texto-tarjeta">ATENCIÓN FINALIZADA</h6>
                                <h3 class="numero-tarjeta">168</h3>
                            </div>

                            <div class="tarjeta-naranja">
                                <h6 class="texto-tarjeta">EN SALA DE ESPERA</h6>
                                <h3 class="numero-tarjeta">35</h3>
                            </div>

                            <div class="tarjeta-naranja">
                                <h6 class="texto-tarjeta">CONSULTORIOS DISPONIBLES</h6>
                                <h3 class="numero-tarjeta">5</h3>
                            </div>

                        </div>
                    </div>



                </div>
            </div>
        </div>

    </main>


    <!-- Footer -->
    <!-- <div th:insert="~{usuario/tekmplateUsuario.html::footer-user}"></div> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
